name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format and lint
        run: |
          . .venv/bin/activate
          ruff check src tests
          black --check src tests
          pycodestyle src
          pydocstyle src

      - name: Type checking
        run: |
          . .venv/bin/activate
          mypy src
          pyright src

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security audit with Bandit
        run: |
          . .venv/bin/activate
          bandit -r src -lll -q

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          . .venv/bin/activate
          pytest

  update-build:
    if: >-
      github.ref == 'refs/heads/develop'
      || github.event.pull_request.base.ref == 'develop'
    needs: [lint, security, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: update-build-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Increment BUILD number
        run: |
          OLD_BUILD=$(cat BUILD 2>/dev/null || echo 0)
          NEW_BUILD=$((OLD_BUILD + 1))
          echo $NEW_BUILD > BUILD

      - name: Commit and push BUILD update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD
          git commit -m "chore: BUILD $(cat BUILD) [skip ci]" || echo "No changes to commit"
          git push

  docs:
    needs: [lint, security, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build documentation with pdoc
        run: PYTHONPATH=src pdoc json2csv -o docs/_build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html

      - name: Publish documentation to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
